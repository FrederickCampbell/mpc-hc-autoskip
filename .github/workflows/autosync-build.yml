name: AutoSync + Build AutoSkip

on:
  workflow_dispatch:
  push:
    branches:
      - autoskip
      - chore/rolling-release-no-artifacts
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: autoskip-sync-build
  cancel-in-progress: true

env:
  UPSTREAM_REPO: clsid2/mpc-hc
  UPSTREAM_BRANCH: develop

jobs:
  sync-build-release:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout AutoSkip branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (-not (git remote | Select-String '^upstream$')) {
            git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          }
          git remote set-url upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"

      - name: Fetch and merge upstream when needed
        id: sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --tags

          $upstreamSha = (git rev-parse "upstream/${{ env.UPSTREAM_BRANCH }}").Trim()
          $upstreamShort = $upstreamSha.Substring(0, 8)
          "upstream_sha=$upstreamSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "upstream_short=$upstreamShort" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          git merge-base --is-ancestor $upstreamSha HEAD
          $alreadyContains = ($LASTEXITCODE -eq 0)
          $forceBuild = "${{ github.event_name }}" -in @('workflow_dispatch', 'push')

          if ($alreadyContains) {
            "had_merge=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            if ($forceBuild) {
              "build_needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              Write-Host "Already current with upstream; explicit run requested a rebuild."
            } else {
              "build_needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              Write-Host "No upstream changes. Nothing to build."
            }
            exit 0
          }

          Write-Host "Merging upstream/${{ env.UPSTREAM_BRANCH }} ($upstreamShort)..."
          git merge --no-edit "upstream/${{ env.UPSTREAM_BRANCH }}"
          $mergeExit = $LASTEXITCODE

          if ($mergeExit -ne 0) {
            $unmerged = @(git diff --name-only --diff-filter=U)
            $expectedConflict = 'src/mpc-hc/PPageAdvanced.cpp'

            if ($unmerged.Count -eq 1 -and $unmerged[0] -eq $expectedConflict) {
              Write-Host "Auto-resolving expected AutoSkip settings conflict in $expectedConflict..."
              git checkout --theirs -- $expectedConflict
              if ($LASTEXITCODE -ne 0) {
                throw "Could not check out upstream side of $expectedConflict"
              }

              $text = [IO.File]::ReadAllText($expectedConflict)
              $anchor = '    addBoolItem(LOOP_FOLDER_NEXT_FILE, IDS_RS_LOOP_FOLDER_NEXT_FILE, false, s.bLoopFolderOnPlayNextFile, StrRes(IDS_PPAGEADVANCED_LOOP_FOLDER_NEXT_FILE));'
              $autoSkip = @'
    addBoolItem(AUTOSKIP_CHAPTERS, L"AutoSkipChapters", true, s.bAutoSkipChapters, L"Automatically skip file chapters whose title matches AutoSkipChapterPatterns.");
    addCStringItem(AUTOSKIP_CHAPTER_PATTERNS, L"AutoSkipChapterPatterns", L"opening;ending;yokoku;preview", s.sAutoSkipChapterPatterns, L"Semicolon-separated, case-insensitive substrings. Example: opening;ending;yokoku;preview");
'@

              if (-not $text.Contains($anchor)) {
                throw "Expected playback-settings anchor was not found in $expectedConflict"
              }
              if (-not $text.Contains('addBoolItem(AUTOSKIP_CHAPTERS')) {
                $text = $text.Replace($anchor, $anchor + "`r`n" + $autoSkip.TrimEnd("`r", "`n"))
                [IO.File]::WriteAllText($expectedConflict, $text, [Text.UTF8Encoding]::new($false))
              }

              git add -- $expectedConflict
              $remaining = @(git diff --name-only --diff-filter=U)
              if ($remaining.Count -gt 0) {
                throw "Unresolved merge conflicts remain: $($remaining -join ', ')"
              }

              git diff --cached --check
              if ($LASTEXITCODE -ne 0) {
                throw 'Resolved merge failed git diff --cached --check.'
              }

              git commit --no-edit
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not commit the automatically resolved upstream merge.'
              }
            } else {
              "sync_failed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "build_needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              git status --short
              throw "Unexpected upstream merge conflict(s): $($unmerged -join ', ')"
            }
          }

          "had_merge=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build_needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Refresh submodules
        if: steps.sync.outputs.build_needed == 'true'
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Verify AutoSkip source markers
        if: steps.sync.outputs.build_needed == 'true'
        shell: pwsh
        run: ./.autoskip/Verify-AutoSkipPatch.ps1

      - name: Build MPC-HC x64
        id: build
        if: steps.sync.outputs.build_needed == 'true'
        continue-on-error: true
        shell: pwsh
        run: ./.autoskip/Build-X64.ps1

      - name: Fail safely when build failed
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error 'MPC-HC x64 build failed. Build-X64.ps1 already printed the relevant build-log tail above.'
          exit 1

      - name: Push tested upstream merge
        if: steps.sync.outputs.build_needed == 'true' && steps.build.outcome == 'success' && steps.sync.outputs.had_merge == 'true'
        shell: pwsh
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Package x64 build
        id: package
        if: steps.sync.outputs.build_needed == 'true' && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $version = (Get-Content '.autoskip\VERSION' -Raw).Trim()
          $zip = 'MPC-HC-AutoSkip-x64.zip'

          $stage = Join-Path $env:RUNNER_TEMP 'mpc-hc-autoskip-release'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $stage -ItemType Directory | Out-Null
          Copy-Item 'bin\mpc-hc_x64\*' $stage -Recurse -Force

          $buildOnlyExtensions = @('.pdb', '.lib', '.exp', '.ilk', '.iobj', '.ipdb')
          Get-ChildItem $stage -Recurse -File | Where-Object {
            $buildOnlyExtensions -contains $_.Extension.ToLowerInvariant()
          } | Remove-Item -Force

          New-Item (Join-Path $stage 'Shaders') -ItemType Directory -Force | Out-Null
          New-Item (Join-Path $stage 'Shaders11') -ItemType Directory -Force | Out-Null
          Copy-Item 'src\mpc-hc\res\shaders\dx9\*.hlsl' (Join-Path $stage 'Shaders') -Force
          Copy-Item 'src\mpc-hc\res\shaders\dx11\*.hlsl' (Join-Path $stage 'Shaders11') -Force
          Copy-Item 'COPYING.txt' $stage -Force

          @"
          MPC-HC AutoSkip $version
          Upstream: ${{ env.UPSTREAM_REPO }}@${{ steps.sync.outputs.upstream_sha }}
          Fork commit: $(git rev-parse HEAD)
          Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          AutoSkip UI:
          Options > Advanced > Playback
            AutoSkipChapters = True
            AutoSkipChapterPatterns = opening;ending;yokoku;preview
          "@ | Set-Content (Join-Path $stage 'AUTOSKIP-BUILD.txt') -Encoding utf8

          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish rolling GitHub release
        if: github.ref_name == 'autoskip' && steps.sync.outputs.build_needed == 'true' && steps.build.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = 'autoskip-latest'
          $zip = '${{ steps.package.outputs.zip }}'
          $version = '${{ steps.package.outputs.version }}'

          git tag -f $tag HEAD
          git push origin "refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not update autoskip-latest tag.'
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'autoskip-release-notes.md'
          @"
          Latest automatic x64 build of MPC-HC with native chapter AutoSkip.

          - AutoSkip version: `$version`
          - Upstream: `${{ env.UPSTREAM_REPO }}@${{ steps.sync.outputs.upstream_sha }}`
          - Fork commit: `$(git rev-parse HEAD)`
          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Configure in **Options > Advanced > Playback**:
          - `AutoSkipChapters`
          - `AutoSkipChapterPatterns`
          "@ | Set-Content $notesPath -Encoding utf8

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace rolling release asset.' }
            gh release edit $tag --repo "${{ github.repository }}" --title 'MPC-HC AutoSkip (Latest)' --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not update rolling release metadata.' }
          } else {
            gh release create $tag $zip --repo "${{ github.repository }}" --title 'MPC-HC AutoSkip (Latest)' --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create rolling release.' }
          }

      - name: Remove legacy AutoSkip releases and Actions artifacts
        if: github.ref_name == 'autoskip' && steps.sync.outputs.build_needed == 'true' && steps.build.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $legacyTags = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("autoskip-v")) | .tagName')
          foreach ($legacyTag in $legacyTags) {
            if ($legacyTag) {
              Write-Host "Deleting legacy release $legacyTag"
              gh release delete $legacyTag --repo "${{ github.repository }}" --cleanup-tag --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not delete legacy release $legacyTag" }
            }
          }

          $artifactIds = @(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          foreach ($artifactId in $artifactIds) {
            if ($artifactId) {
              Write-Host "Deleting Actions artifact $artifactId"
              gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifactId" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Could not delete Actions artifact $artifactId" }
            }
          }
