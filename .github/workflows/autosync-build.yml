name: AutoSync + Build AutoSkip

on:
  workflow_dispatch:
  push:
    branches: [autoskip]
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write
  actions: write

# Serialize publication. A new push must not interrupt an asset/tag update.
concurrency:
  group: autoskip-sync-build-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: clsid2/mpc-hc
  UPSTREAM_BRANCH: develop

jobs:
  sync-build-release:
    if: github.ref == 'refs/heads/autoskip' && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout AutoSkip branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: autoskip
          fetch-depth: 0

      - name: Prepare tested upstream candidate
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure Git identity.' }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure Git identity.' }
          ./.autoskip/Sync-Upstream.ps1 -UpstreamUrl ("https://github.com/{0}.git" -f $env:UPSTREAM_REPO) -UpstreamBranch $env:UPSTREAM_BRANCH -EnsureReleaseCurrent -ForceBuild:($env:GITHUB_EVENT_NAME -in @('workflow_dispatch', 'push'))

      - name: Refresh submodules
        if: steps.sync.outputs.build_needed == 'true'
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodules.' }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not update submodules.' }

      - name: Verify AutoSkip behavior is wired into the source
        if: steps.sync.outputs.build_needed == 'true'
        run: ./.autoskip/Verify-AutoSkipPatch.ps1

      - name: Build MPC-HC x64
        if: steps.sync.outputs.build_needed == 'true'
        run: ./.autoskip/Build-X64.ps1

      - name: Validate and package x64 build
        id: package
        if: steps.sync.outputs.build_needed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          CANDIDATE_SHA: ${{ steps.sync.outputs.candidate_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.autoskip/Package-X64.ps1 -UpstreamSha $env:UPSTREAM_SHA -CandidateSha $env:CANDIDATE_SHA -RunUrl $env:RUN_URL

      - name: Push the tested candidate if the branch is still current
        if: steps.sync.outputs.build_needed == 'true'
        env:
          INITIAL_SHA: ${{ steps.sync.outputs.initial_sha }}
          CANDIDATE_SHA: ${{ steps.sync.outputs.candidate_sha }}
          HAD_MERGE: ${{ steps.sync.outputs.had_merge }}
        run: ./.autoskip/Push-TestedCandidate.ps1 -InitialSha $env:INITIAL_SHA -CandidateSha $env:CANDIDATE_SHA -HadMerge:($env:HAD_MERGE -eq 'true')

      - name: Publish verified rolling release
        id: publish
        if: steps.sync.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          CANDIDATE_SHA: ${{ steps.sync.outputs.candidate_sha }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
          AUTOSKIP_VERSION: ${{ steps.package.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.autoskip/Publish-Release.ps1 -Repository $env:GITHUB_REPOSITORY -CandidateSha $env:CANDIDATE_SHA -UpstreamSha $env:UPSTREAM_SHA -Zip $env:ZIP_PATH -Checksum $env:CHECKSUM_PATH -Version $env:AUTOSKIP_VERSION -RunUrl $env:RUN_URL

      - name: Remove legacy AutoSkip releases and Actions artifacts
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("autoskip-v")) | .tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list legacy releases.' }
          foreach ($tag in $tags) {
            if ($tag) {
              gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove legacy release $tag" }
            }
          }
          $ids = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list old Actions artifacts.' }
          foreach ($id in $ids) {
            if ($id) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
              if ($LASTEXITCODE -ne 0) { throw "Could not remove old Actions artifact $id" }
            }
          }

      - name: Report the first actionable failure
        if: failure()
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          CANDIDATE_SHA: ${{ steps.sync.outputs.candidate_sha }}
        run: ./.autoskip/Report-Failure.ps1 -UpstreamSha $env:UPSTREAM_SHA -CandidateSha $env:CANDIDATE_SHA
